name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: kata-sn60
      - uses: actions/checkout@v7
        with:
          repository: Autovara/kata
          path: kata
      - uses: actions/checkout@v7
        with:
          repository: Autovara/kata-tee-runner
          path: kata-tee-runner
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run --extra dev ruff check kata_sn60 tests
        working-directory: kata-sn60
      - run: uv run --extra dev pytest -q
        working-directory: kata-sn60
      # The vendored sandbox is what the lane scores against. Verifying it here means a tampered or
      # drifted tree fails the build rather than a round -- and it runs on a fresh checkout, so it
      # checks what is committed, not what happens to be on a developer's disk.
      - run: uv run python tools/vendor_sandbox.py verify
        working-directory: kata-sn60
