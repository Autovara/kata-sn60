services:
  kata-sn60-runner:
    # Public security policy is literal in this manifest so Phala's compose measurement commits to
    # the exact runner, project images, provider routes, and execution bounds.
    image: ghcr.io/autovara/kata-sn60-runner@sha256:1019643932462708923608a32761d49069d93b57f3152a93413463929983d90d
    ports:
      # Phala exposes this port through its HTTPS gateway so the external validator can reach the
      # room. /health and /pubkey are public; /run requires a signed, short-lived HMAC request.
      - "8080:8080"
    environment:
      # Actual credentials remain Phala Encrypted Secrets and are intentionally not measured.
      KATA_ROOM_AUTH_SECRET: ${KATA_ROOM_AUTH_SECRET:?Set KATA_ROOM_AUTH_SECRET}
      # Keep diagnostics off in production. /pull-test is otherwise a signed POST-only endpoint.
      KATA_ROOM_ENABLE_DIAGNOSTICS: "false"
      # Signed /run requests are valid for a bounded period; the profile separately caps the agent.
      KATA_ROOM_MAX_REQUEST_LIFETIME_SECONDS: "900"
      KATA_ROOM_MAX_REQUEST_BYTES: "1048576"
      KATA_ROOM_MAX_COMPRESSED_BUNDLE_BYTES: "524288"
      KATA_ROOM_MAX_EXTRACTED_BUNDLE_BYTES: "262144"
      KATA_ROOM_MAX_BUNDLE_FILES: "16"
      # NOTE: there is intentionally NO plaintext INFERENCE_API_KEY here — inference keys arrive
      # per request, sealed to the room, and are decrypted inside it (see room.sealing).
      # Registry package-read login used to pull approved private problem images.
      GHCR_USER: "autovara"
      GHCR_TOKEN: ${GHCR_TOKEN:?Set GHCR_TOKEN}
      # JSON map: each allowed project key -> sha256:<64 hex>. There is no :latest fallback.
      KATA_SN60_TEE_IMAGE_DIGESTS_JSON: >-
        {
          "cantina_generic-money_2025_11": "sha256:b186c5734884112e3424dd13e113bb3cd9f8ba426f80ab2ab4b01567d0a9a9c5",
          "cantina_minimal-delegation_2025_04": "sha256:3926fe14600a1cb4c9c5f81a84882267895fbca75c2482c5ec6a8b43a7afdaf8",
          "cantina_smart-contract-audit-of-tn-contracts_2025_08": "sha256:8dbba637540b9a9de35c9194b8942ede2b3c5d2011b9e9c09b3811c4f2ec9fea",
          "code4rena_bakerfi-invitational_2025_02": "sha256:d3d6956e30b4f4aa8cf75ded1350d5c0ff6bf964f5fde018b028ac1b5e1cbea4",
          "code4rena_coded-estate-invitational_2024_12": "sha256:2619999693d3e9f78653e4c5ace0f9901a7b7eea295adb70727dc00a82290250",
          "code4rena_fenix-finance-invitational_2024_10": "sha256:dfe7811dbc07e8189d09a4f8fd3096c3a343313ef3f2db117296e9a79af6fab1",
          "code4rena_forte-float128-solidity-library_2025_04": "sha256:89f6a6070b04f09aac6b86167abb958b82b525c7043e13c081f8b5840605bdc4",
          "code4rena_initia-move_2025_04": "sha256:22939cff3bbcd0c01d992a8cc1b5fdbb50cd36a09f3b44dabbfe31f71a440165",
          "code4rena_kinetiq_2025_07": "sha256:e07198340b40dd2c770a04ef215053dfdbbbb82405274c5d57429318a328c623",
          "code4rena_lambowin_2025_02": "sha256:e2038b268a6e22f602d46aa203647b6dece5fdac8066d891ae69d6644ca1ce0a",
          "code4rena_loopfi_2025_02": "sha256:91602b3cb211670411e2dfdc7ec748b1fee831265ddf34fa431c121afe99072b",
          "code4rena_mantra-dex_2025_03": "sha256:fba76df79070dede5911978ab6b0f6c1cdc9d25cb60e3ba370f85a445da05939",
