[project]
name = "kata-sn60"
version = "0.1.0"
description = "SN60 (Bitsec) subnet plugin for the Kata competition platform."
requires-python = ">=3.12"
dependencies = [
  "kata",
  # TDX quote verification for the sealed-room (TEE) SN60 execution path.
  "dcap-qvl==0.5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

# Discovered by the Kata platform via the kata.subnets entry-point group.
[project.entry-points."kata.subnets"]
sn60 = "kata_sn60:SN60_BITSEC_PLUGIN"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the package. The vendored sandbox is deliberately NOT force-included into the wheel: the
# lane is installed with `uv run --with-editable /srv/kata-sn60`, so the staged SOURCE TREE is what
# ends up on sys.path and `sandbox/` sits beside the package exactly as it does in a checkout.
# Shipping it inside the wheel instead makes pip byte-compile the pinned tree, and every resulting
# __pycache__/*.pyc is an unlisted file that fails manifest verification on every round.
packages = ["kata_sn60"]

[tool.uv.sources]
kata = { path = "../kata", editable = true }

[tool.ruff]
# The vendored sandbox is EVIDENCE, not our source. Linting it would be meaningless -- it is
# upstream's code at a pinned commit -- and worse, ruff writes a .ruff_cache into whatever it walks,
# which the manifest correctly reports as an unlisted file and refuses. Caught exactly that way.
extend-exclude = ["sandbox"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The vendored sandbox ships upstream's own test suite. It is part of the pinned tree and must stay
# byte-identical, but it is not ours to run.
norecursedirs = ["sandbox", ".venv", "dist"]
